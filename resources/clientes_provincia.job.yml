resources:
  jobs:
    clientes_provincia:
      name: clientes-provincia-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: agregar_provincia_y_clientes
          environment_key: serverless
          notebook_task:
            notebook_path: ../src/clientes_provincia.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ventas
      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"